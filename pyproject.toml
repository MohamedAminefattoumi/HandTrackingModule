[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "handtrackingmodule"
version = "0.1.0"
description = "Simple hand tracking helper module built on OpenCV and MediaPipe"
requires-python = ">=3.9"
dependencies = [
    "opencv-python",
    "mediapipe",
]

[tool.setuptools.packages.find]
include = ["handtrackingmodule*"]